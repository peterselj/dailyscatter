name: Test

# Unit tests on every push and pull request. No dependencies to install, so
# this takes well under a minute. It also catches a forgotten `npm run stamp`.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
